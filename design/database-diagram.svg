<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background:#f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="75" fill="#0f172a"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#ffffff">ViewBox Panel System — Relational Database Schema</text>
  <text x="1240" y="46" font-size="14" fill="#94a3b8">PostgreSQL / Neon / SQLAlchemy 2.0</text>

  <!-- TABLE 1: USERS -->
  <g transform="translate(50, 110)" filter="url(#shadow)">
    <rect width="320" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="320" height="34" rx="8" fill="#1e293b"/>
    <rect y="20" width="320" height="14" fill="#1e293b"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">users</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="210" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="40" y="82" font-size="12" fill="#0f172a">phone</text><text x="210" y="82" font-size="11" fill="#64748b">VARCHAR (UNQ)</text>
    <text x="40" y="106" font-size="12" fill="#0f172a">name</text><text x="210" y="106" font-size="11" fill="#64748b">VARCHAR</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">role</text><text x="210" y="130" font-size="11" fill="#64748b">VARCHAR (mbr/adm)</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">referral_code</text><text x="210" y="154" font-size="11" fill="#64748b">VARCHAR (UNQ)</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">created_at</text><text x="210" y="178" font-size="11" fill="#64748b">TIMESTAMP</text>
  </g>

  <!-- TABLE 2: MEMBER_PROFILES -->
  <g transform="translate(430, 110)" filter="url(#shadow)">
    <rect width="330" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="330" height="34" rx="8" fill="#0e7490"/>
    <rect y="20" width="330" height="14" fill="#0e7490"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">member_profiles</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="220" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">user_id</text><text x="220" y="82" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
    <text x="40" y="106" font-size="12" fill="#0f172a">date_of_birth</text><text x="220" y="106" font-size="11" fill="#64748b">DATE</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">gender</text><text x="220" y="130" font-size="11" fill="#64748b">VARCHAR(20)</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">city</text><text x="220" y="154" font-size="11" fill="#64748b">VARCHAR(50)</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">income_range</text><text x="220" y="178" font-size="11" fill="#64748b">VARCHAR(50)</text>
    <text x="40" y="202" font-size="12" fill="#0f172a">interests</text><text x="220" y="202" font-size="11" fill="#64748b">TEXT (comma-sep)</text>
  </g>

  <!-- TABLE 3: SOURCES -->
  <g transform="translate(820, 110)" filter="url(#shadow)">
    <rect width="320" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="320" height="34" rx="8" fill="#059669"/>
    <rect y="20" width="320" height="14" fill="#059669"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">sources</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="210" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="40" y="82" font-size="12" fill="#0f172a">name</text><text x="210" y="82" font-size="11" fill="#64748b">VARCHAR(100)</text>
    <text x="40" y="106" font-size="12" fill="#0f172a">type</text><text x="210" y="106" font-size="11" fill="#64748b">VARCHAR(50)</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">slug</text><text x="210" y="130" font-size="11" fill="#64748b">VARCHAR (UNQ)</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">is_active</text><text x="210" y="154" font-size="11" fill="#64748b">BOOLEAN</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">created_at</text><text x="210" y="178" font-size="11" fill="#64748b">TIMESTAMP</text>
  </g>

  <!-- TABLE 4: SIGNUP_LINKS -->
  <g transform="translate(1200, 110)" filter="url(#shadow)">
    <rect width="330" height="175" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="330" height="34" rx="8" fill="#047857"/>
    <rect y="20" width="330" height="14" fill="#047857"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">signup_links</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="210" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">source_id</text><text x="210" y="82" font-size="11" fill="#64748b">INT -&gt; sources(id)</text>
    <text x="14" y="106" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="106" font-size="12" fill="#0f172a">referrer_user_id</text><text x="210" y="106" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">token</text><text x="210" y="130" font-size="11" fill="#64748b">VARCHAR (UNQ)</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">created_at</text><text x="210" y="154" font-size="11" fill="#64748b">TIMESTAMP</text>
  </g>

  <!-- TABLE 5: SIGNUPS (Attribution Junction) -->
  <g transform="translate(820, 370)" filter="url(#shadow)">
    <rect width="340" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="340" height="34" rx="8" fill="#0d9488"/>
    <rect y="20" width="340" height="14" fill="#0d9488"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">signups (Attribution Junction)</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="230" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">user_id</text><text x="230" y="82" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
    <text x="14" y="106" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="106" font-size="12" fill="#0f172a">source_id</text><text x="230" y="106" font-size="11" fill="#64748b">INT -&gt; sources(id)</text>
    <text x="14" y="130" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="130" font-size="12" fill="#0f172a">signup_link_id</text><text x="230" y="130" font-size="11" fill="#64748b">INT -&gt; signup_links</text>
    <text x="14" y="154" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="154" font-size="12" fill="#0f172a">referrer_user_id</text><text x="230" y="154" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
  </g>

  <!-- TABLE 6: REFERRALS -->
  <g transform="translate(50, 390)" filter="url(#shadow)">
    <rect width="340" height="225" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="340" height="34" rx="8" fill="#9333ea"/>
    <rect y="20" width="340" height="14" fill="#9333ea"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">referrals (Lifecycle)</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="230" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">referrer_id</text><text x="230" y="82" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
    <text x="14" y="106" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="106" font-size="12" fill="#0f172a">referred_id</text><text x="230" y="106" font-size="11" fill="#64748b">INT -&gt; users(id) [UNQ]</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">stage</text><text x="230" y="130" font-size="11" fill="#64748b">lead/fit/completed/fail</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">fail_reason</text><text x="230" y="154" font-size="11" fill="#64748b">TEXT</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">created_at</text><text x="230" y="178" font-size="11" fill="#64748b">TIMESTAMP</text>
    <text x="40" y="202" font-size="12" fill="#0f172a">updated_at</text><text x="230" y="202" font-size="11" fill="#64748b">TIMESTAMP</text>
  </g>

  <!-- TABLE 7: SURVEYS -->
  <g transform="translate(50, 680)" filter="url(#shadow)">
    <rect width="340" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="340" height="34" rx="8" fill="#e11d48"/>
    <rect y="20" width="340" height="14" fill="#e11d48"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">surveys</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="230" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="40" y="82" font-size="12" fill="#0f172a">title</text><text x="230" y="82" font-size="11" fill="#64748b">VARCHAR(200)</text>
    <text x="40" y="106" font-size="12" fill="#0f172a">description</text><text x="230" y="106" font-size="11" fill="#64748b">TEXT</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">reward_amount</text><text x="230" y="130" font-size="11" fill="#64748b">INTEGER (INR)</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">quota</text><text x="230" y="154" font-size="11" fill="#64748b">INTEGER (Cap)</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">category</text><text x="230" y="178" font-size="11" fill="#64748b">VARCHAR(50)</text>
    <text x="40" y="202" font-size="12" fill="#0f172a">deadline</text><text x="230" y="202" font-size="11" fill="#64748b">DATE (15-day cycle)</text>
    <text x="40" y="226" font-size="12" fill="#0f172a">status</text><text x="230" y="226" font-size="11" fill="#64748b">active / closed</text>
  </g>

  <!-- TABLE 8: SURVEY_RULES -->
  <g transform="translate(440, 680)" filter="url(#shadow)">
    <rect width="360" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="360" height="34" rx="8" fill="#ea580c"/>
    <rect y="20" width="360" height="14" fill="#ea580c"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">survey_rules (Screening Engine)</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="240" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">survey_id</text><text x="240" y="82" font-size="11" fill="#64748b">INT -&gt; surveys(id)</text>
    <text x="40" y="106" font-size="12" fill="#0f172a">field</text><text x="240" y="106" font-size="11" fill="#64748b">age/city/gender/income</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">operator</text><text x="240" y="130" font-size="11" fill="#64748b">between/eq/in/gte</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">value</text><text x="240" y="154" font-size="11" fill="#64748b">VARCHAR(200)</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">strictness</text><text x="240" y="178" font-size="11" fill="#64748b">strict / flexible</text>
  </g>

  <!-- TABLE 9: PARTICIPATIONS -->
  <g transform="translate(860, 680)" filter="url(#shadow)">
    <rect width="360" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="360" height="34" rx="8" fill="#2563eb"/>
    <rect y="20" width="360" height="14" fill="#2563eb"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">participations (Cool-off &amp; Status)</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="240" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">member_id</text><text x="240" y="82" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
    <text x="14" y="106" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="106" font-size="12" fill="#0f172a">survey_id</text><text x="240" y="106" font-size="11" fill="#64748b">INT -&gt; surveys(id)</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">result</text><text x="240" y="130" font-size="11" fill="#64748b">approved/wait/reject/comp</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">reason</text><text x="240" y="154" font-size="11" fill="#64748b">TEXT (Plain words)</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">completed_on</text><text x="240" y="178" font-size="11" fill="#64748b">DATE (Sets 90-day cool-off)</text>
    <text x="40" y="202" font-size="12" fill="#0f172a">created_at</text><text x="240" y="202" font-size="11" fill="#64748b">TIMESTAMP</text>
  </g>

  <!-- TABLE 10: PAYOUTS (Bonus Architecture) -->
  <g transform="translate(1270, 680)" filter="url(#shadow)">
    <rect width="280" height="220" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="280" height="34" rx="8" fill="#64748b"/>
    <rect y="20" width="280" height="14" fill="#64748b"/>
    <text x="14" y="23" font-size="14" font-weight="700" fill="#ffffff">payouts (Ledger Design)</text>
    <text x="14" y="58" font-size="11" font-weight="700" fill="#d97706">PK</text><text x="40" y="58" font-size="12" fill="#0f172a">id</text><text x="180" y="58" font-size="11" fill="#64748b">INTEGER</text>
    <text x="14" y="82" font-size="11" font-weight="700" fill="#7c3aed">FK</text><text x="40" y="82" font-size="12" fill="#0f172a">user_id</text><text x="180" y="82" font-size="11" fill="#64748b">INT -&gt; users(id)</text>
    <text x="40" y="106" font-size="12" fill="#0f172a">amount</text><text x="180" y="106" font-size="11" fill="#64748b">DECIMAL(10,2)</text>
    <text x="40" y="130" font-size="12" fill="#0f172a">payout_type</text><text x="180" y="130" font-size="11" fill="#64748b">survey / referral</text>
    <text x="40" y="154" font-size="12" fill="#0f172a">status</text><text x="180" y="154" font-size="11" fill="#64748b">pending/paid/fail</text>
    <text x="40" y="178" font-size="12" fill="#0f172a">gateway_id</text><text x="180" y="178" font-size="11" fill="#64748b">VARCHAR(Razorpay)</text>
    <text x="40" y="202" font-size="12" fill="#0f172a">processed_at</text><text x="180" y="202" font-size="11" fill="#64748b">TIMESTAMP</text>
  </g>

  <!-- Connectors -->
  <!-- users to member_profiles (1:1) -->
  <path d="M 370 200 L 430 200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4"/>
  <!-- users to referrals (1:N) -->
  <path d="M 210 310 L 210 390" stroke="#94a3b8" stroke-width="2"/>
  <!-- sources to signups (1:N) -->
  <path d="M 980 310 L 980 370" stroke="#94a3b8" stroke-width="2"/>
  <!-- surveys to survey_rules (1:N) -->
  <path d="M 390 770 L 440 770" stroke="#94a3b8" stroke-width="2"/>
  <!-- surveys to participations (1:N) -->
  <path d="M 390 830 L 860 830" stroke="#94a3b8" stroke-width="2"/>
</svg>